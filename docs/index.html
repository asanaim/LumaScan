<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NuvioScan — Offline Searchable Document Scanner for Android</title>
  <style>
    :root {
      --bg: #F2F2F7;
      --card-bg: rgba(255, 255, 255, 0.88);
      --accent: #0A84FF;
      --accent-hover: #0071E3;
      --text: #1C1C1E;
      --secondary: #8E8E93;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      max-width: 680px;
      width: 100%;
      text-align: center;
    }
    .app-icon {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      box-shadow: 0 16px 36px rgba(0, 81, 213, 0.28);
      margin: 20px auto 28px auto;
      background: linear-gradient(135deg, #0A84FF, #0051D5);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .app-icon svg {
      width: 80px;
      height: 80px;
    }
    h1 {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }
    p.subtitle {
      font-size: 19px;
      color: var(--secondary);
      line-height: 1.45;
      margin-bottom: 34px;
    }
    .download-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      border: 1px solid rgba(255,255,255,0.7);
      margin-bottom: 36px;
    }
    .btn-download {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: #fff;
      font-size: 18px;
      font-weight: 600;
      text-decoration: none;
      padding: 16px 36px;
      border-radius: 980px;
      box-shadow: 0 6px 18px rgba(10, 132, 255, 0.35);
      transition: all 0.2s ease;
      margin-bottom: 14px;
      width: 100%;
      max-width: 380px;
    }
    .btn-download:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .file-meta {
      font-size: 13px;
      color: var(--secondary);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="app-icon">
      <svg viewBox="0 0 108 108" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M28 40V32C28 29.8 29.8 28 32 28H40M68 28H76C78.2 28 80 29.8 80 32V40M80 68V76C80 78.2 78.2 80 76 80H68M40 80H32C29.8 80 28 78.2 28 76V68" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M40 36C38.9 36 38 36.9 38 38V70C38 71.1 38.9 72 40 72H68C69.1 72 70 71.1 70 70V46L60 36H40Z" fill="#FFFFFF" fill-opacity="0.95"/>
        <path d="M44 52H64M44 59H64M44 66H56" stroke="#0051D5" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M24 54H84" stroke="#30D158" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>

    <h1>NuvioScan</h1>
    <p class="subtitle">Fast, privacy-first offline document scanner, searchable PDF maker, and multi-script OCR for Android.</p>

    <div class="download-card">
      <a href="https://github.com/asanaim/LumaScan/releases/latest/download/NuvioScan.apk" class="btn-download">
        Download NuvioScan APK
      </a>
      <div class="file-meta">Version 2.0 • Android 7.0+ (64-bit ARM) • 100% Free & Offline</div>
    </div>
  </div>
</body>
</html>
