name: Build VellumScan APK & Publish Download Page

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Default Offline Tesseract Models (Bangla + English)
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -L -o app/src/main/assets/tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
          curl -L -o app/src/main/assets/tessdata/ben.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/ben.traineddata

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare VellumScan.apk for Direct Download
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/VellumScan.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VellumScan-Android-APK
          path: release-apk/VellumScan.apk

      - name: Publish Direct 1-Click Release Link
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload latest release-apk/VellumScan.apk --clobber --repo "${{ github.repository }}"
          else
            gh release create latest release-apk/VellumScan.apk \
              --title "VellumScan Latest Release (1-Click Download)" \
              --notes "Direct 1-Click Android Download: https://github.com/${{ github.repository }}/releases/latest/download/VellumScan.apk" \
              --repo "${{ github.repository }}"
          fi

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Web Download Page Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy Download Page to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
