name: Build NuvioScan APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Default Offline Tesseract Models (Bangla + English)
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -L -o app/src/main/assets/tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
          curl -L -o app/src/main/assets/tessdata/ben.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/ben.traineddata

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Prepare Release APKs
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/NuvioScan.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/LumaScan.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuvioScan-Release-APK
          path: release-apk/NuvioScan.apk

      - name: Publish 1-Click Direct Download Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "NuvioScan v2.0 (Direct 1-Click APK Download)"
          make_latest: true
          body: |
            ### 📲 Direct 1-Click Download for Android (Non-IT Friendly)
            Tap the link below on any Android phone to download and install **NuvioScan** immediately (no GitHub account required):
            - **[Download NuvioScan.apk](https://github.com/${{ github.repository }}/releases/latest/download/NuvioScan.apk)**
          files: |
            release-apk/NuvioScan.apk
            release-apk/LumaScan.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
