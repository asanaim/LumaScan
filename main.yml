name: Build LumaScan APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Offline Tesseract Models (Bangla + English)
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -L -o app/src/main/assets/tessdata/eng.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/eng.traineddata
          curl -L -o app/src/main/assets/tessdata/ben.traineddata https://github.com/tesseract-ocr/tessdata_fast/raw/main/ben.traineddata

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Copy APK to standard naming for release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/LumaScan.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumaScan-Release-APK
          path: release-apk/LumaScan.apk

      - name: Create or Update GitHub Release (1-Click Download for Non-IT)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "LumaScan Latest Release (Direct 1-Click Download)"
          body: |
            ### Direct 1-Click Download Link for Android:
            Click the link below on any phone or computer to download immediately (no GitHub account required):
            - **[Download LumaScan.apk](https://github.com/${{ github.repository }}/releases/download/latest/LumaScan.apk)**
          files: release-apk/LumaScan.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
